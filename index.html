<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<title>Рунный страж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Rubik:wght@400;500;600&family=Noto+Sans+Runic&display=swap">
<style>
/* Layout: one-screen Telegram Mini App. Status header, boss arena in the middle, energy bar, tab bar at the bottom. Deliberately dark: a fantasy game screen. */
:root{
  --bg:#15121d; --bg-glow:#2a2140; --surface:#1f1b2b; --surface2:#2a253a; --line:#393350;
  --fg:#f2ebdc; --muted:#a39cb8;
  --gold:#f3b64c; --gold-deep:#b8791d; --on-gold:#2a1a05;
  --energy:#62d2e6; --energy-deep:#2b7f9a;
  --hp:#ef6a55; --hp-deep:#a3263a; --ok:#79d39a;
  --silver:#c9cfdc; --bronze:#d08a5a;
  --ring:#f3b64c40; --ring-text:#f3b64c80; --shadow:#00000099;
  --display:"Philosopher", Georgia, "Times New Roman", serif;
  --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --runic:"Noto Sans Runic", "Segoe UI Historic", serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;color:var(--fg);font:400 15px/1.45 var(--body);
  background:radial-gradient(120% 70% at 50% 38%, var(--bg-glow) 0%, var(--bg) 62%) var(--bg);
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

#app{height:100%;max-width:520px;margin:0 auto;padding-inline:16px;display:grid;grid-template-rows:auto 1fr auto;position:relative}

/* header */
.top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 12px;padding-block:12px 6px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.ava{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--line);
  font:700 18px var(--display);color:var(--gold)}
.ava.sm{width:32px;height:32px;border-radius:10px;font-size:15px}
.who-txt{min-width:0;display:grid;justify-items:start;gap:2px}
.pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip{appearance:none;background:none;border:1px solid var(--line);border-radius:6px;padding:0 6px;
  font-size:10px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.wallet{display:flex;align-items:center;gap:8px;font:700 28px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.coin{width:24px;height:24px;flex:none}
.coin.sm{width:16px;height:16px}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--muted);min-width:0}
.stat b{display:block;color:var(--fg);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

main{min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* battle */
.game{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:6px}
.boss-head{display:grid;gap:6px}
.boss-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.boss-name{margin:0;font:700 23px/1.1 var(--display);text-wrap:balance}
.boss-no{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.bar{position:relative;height:16px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:var(--w,100%);transition:width .15s ease-out}
.bar.hp>i{background:linear-gradient(90deg,var(--hp-deep),var(--hp))}
.bar.en{height:10px}
.bar.en>i{background:linear-gradient(90deg,var(--energy-deep),var(--energy))}
.bar>span{position:relative;display:block;text-align:center;font-size:11px;line-height:14px;font-weight:600;font-variant-numeric:tabular-nums}

.arena{flex:1;min-height:0;position:relative;container-type:size;overflow:hidden;display:grid;place-items:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.arena>*{grid-area:1/1}
.ring{width:min(84vw,340px,46vh);width:min(100cqw,100cqh,340px);max-width:100%;aspect-ratio:1;animation:spin 90s linear infinite;pointer-events:none}
.ring text{font:16px var(--runic);fill:var(--ring-text);letter-spacing:2px}
.boss{appearance:none;border:0;background:none;padding:0;cursor:pointer;position:relative;z-index:1;
  width:min(58vw,250px,36vh);width:min(70cqw,66cqh,250px);max-width:100%;aspect-ratio:200/220;border-radius:40%;touch-action:none}
.boss:focus-visible{outline:2px solid var(--gold);outline-offset:10px}
.boss .float{display:block;width:100%;height:100%;animation:bob 3.4s ease-in-out infinite}
.boss svg{display:block;width:100%;height:100%;filter:drop-shadow(0 12px 28px var(--b-glow,#6c51d880))}
.boss.hit svg{animation:squash .14s ease-out}
.boss.dying .float{animation:die .55s ease-in forwards}
.boss.appear .float{animation:appear .45s ease-out}
.tap-hint{align-self:end;margin:0 0 4px;font-size:13px;color:var(--muted);text-align:center;pointer-events:none}

.fx{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.dmg{font:700 28px/1 var(--display);color:var(--gold);text-shadow:0 2px 0 var(--gold-deep),0 0 14px var(--shadow);animation:rise .8s ease-out forwards}
.dmg.merc{font-size:17px;color:var(--energy);text-shadow:0 0 10px var(--shadow)}
.shard{width:9px;height:9px;margin:-4px 0 0 -4px;background:var(--c);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:burst .6s ease-out forwards}

.energy{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 8px;padding-block:0 8px}
.energy .lbl{display:flex;align-items:center;gap:6px;font-weight:600;font-variant-numeric:tabular-nums}
.bolt{width:18px;height:18px;color:var(--energy)}
.energy .rate{font-size:12px;color:var(--muted)}
.energy .bar{grid-column:1/-1}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes squash{40%{transform:scale(.93,.95)}}
@keyframes die{to{transform:scale(1.25);opacity:0}}
@keyframes appear{from{transform:scale(.6);opacity:0}}
@keyframes rise{from{transform:translate(-50%,-50%) scale(1.15);opacity:1}to{transform:translate(-50%,-150%) scale(.9);opacity:0}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(220deg);opacity:0}}
@keyframes toast{from{transform:translateY(8px);opacity:0}}

/* panels */
.panel{display:grid;gap:14px;padding-block:8px 18px;align-content:start}
.panel h2{margin:0;font:700 26px/1.15 var(--display);text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.card.friend{grid-template-columns:32px minmax(0,1fr) auto}
.ic{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--gold)}
.ic svg{width:22px;height:22px}
.card h3{margin:0;font-size:15px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.lvl{font-size:11px;font-weight:500;color:var(--muted)}
.card p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.delta{margin-top:4px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.delta b{color:var(--ok);font-weight:600}
.rw{display:inline-flex;align-items:center;gap:4px;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.prog{margin-top:6px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog>i{display:block;height:100%;width:var(--w,0%);background:var(--gold)}
.done,.count{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.done{color:var(--ok)}

.btn{appearance:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font:600 13px var(--body);font-variant-numeric:tabular-nums;color:var(--on-gold);
  background:linear-gradient(180deg,var(--gold),var(--gold-deep))}
.btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.wide{width:100%;padding-block:11px}
.btn:focus-visible,.nav button:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.daily{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:12px}
.daily-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.daily h3{margin:0;font-size:15px}
.daily p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:grid;gap:2px;padding:6px 2px;border-radius:8px;background:var(--surface2);text-align:center;font-size:10px;color:var(--muted)}
.day b{font-size:11px;color:var(--fg);font-variant-numeric:tabular-nums}
.day.got{opacity:.45}
.day.now{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}

.promo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px dashed var(--gold);background:var(--surface)}
.eyebrow{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.promo code{font:700 20px var(--display);letter-spacing:.06em;color:var(--gold)}

.ref{display:grid;gap:8px}
.ref label{font-size:12px;color:var(--muted)}
.ref-row{display:flex;gap:8px}
.ref-row input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--fg);font:13px var(--body)}
.friends-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.friends-head b{color:var(--fg);font-variant-numeric:tabular-nums}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.empty h3{margin:0 0 4px;font:700 18px var(--display)}
.empty p{margin:0;color:var(--muted);font-size:13px}
.note{margin:0;font-size:12px;color:var(--muted)}

.board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.row{display:grid;grid-template-columns:24px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface)}
.rank{font:700 16px var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.p1 .rank{color:var(--gold)} .p2 .rank{color:var(--silver)} .p3 .rank{color:var(--bronze)}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm em{font-style:normal;font-size:11px;color:var(--on-gold);background:var(--gold);border-radius:5px;padding:1px 5px;margin-left:4px}
.val{font-weight:600;font-variant-numeric:tabular-nums}
.row.me{background:var(--surface2);box-shadow:inset 0 0 0 1px var(--gold)}

/* tab bar */
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:8px 10px;border-top:1px solid var(--line)}
.nav button{appearance:none;background:none;border:0;cursor:pointer;position:relative;display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:10px;font-size:11px;font-weight:500;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--gold);background:var(--surface)}
.nav svg{width:22px;height:22px}
.dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--hp)}

.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:5;padding:10px 14px;border-radius:12px;text-align:center;font-size:13.5px;
  background:var(--surface2);border:1px solid var(--line);box-shadow:0 10px 30px var(--shadow);animation:toast .2s ease-out}

@media (max-width:360px){
  .card{grid-template-columns:44px minmax(0,1fr)}
  .card>.btn,.card>.done,.card>.count{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  .ring,.boss .float{animation:none}
  .dmg{animation-duration:.45s}
}
</style>

<div id="app">
  <header class="top">
    <div class="who">
      <div class="ava" id="ava">С</div>
      <div class="who-txt">
        <div class="pname" id="pname">Странник</div>
        <button class="chip" id="demoChip" type="button">Демо-версия</button>
      </div>
    </div>
    <div class="wallet" aria-label="Золото"><svg class="coin"><use href="#i-coin"/></svg><span id="gold">0</span></div>
    <div class="stats">
      <div class="stat">За удар<b id="stTap">+1</b></div>
      <div class="stat">Наёмники в час<b id="stMerc">0</b></div>
      <div class="stat">Боссов побеждено<b id="stKills">0</b></div>
    </div>
  </header>

  <main id="main">
    <section class="tab game" data-tab="game">
      <div class="boss-head">
        <div class="boss-title">
          <h1 class="boss-name" id="bossName">Каменный страж</h1>

        <div class="bar hp" role="img" aria-label="Здоровье босса"><i id="hpFill"></i><span id="hpText">150 / 150</span></div>

              <polygon points="74,66 92,70 82,75" fill="#fff6dc"/>
              <polygon points="126,66 108,70 118,75" fill="#fff6dc"/>
              <path d="M100 112v44M100 124l-12-9M100 124l12-9M100 142l-10 8M100 142l10 8" stroke="#ffb02e" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#soft)" opacity=".8"/>
              <path d="M100 112v44M100 124l-12-9M100 124l12-9M100 142l-10 8M100 142l10 8" stroke="#ffe3a3" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            </svg>
          </span>
        </button>
        <p class="tap-hint" id="tapHint">Нажимайте на стража: каждый удар приносит золото</p>
      </div>

      <div class="energy">
        <div class="lbl"><svg class="bolt"><use href="#i-bolt"/></svg><span id="enText">500 / 500</span></div>
        <div class="rate" id="enRate">+2 в сек</div>
        <div class="bar en" role="img" aria-label="Энергия"><i id="enFill"></i></div>
      </div>
    </section>

    <section class="tab panel" data-tab="upgrades" id="tabUp" hidden></section>
    <section class="tab panel" data-tab="tasks" id="tabTasks" hidden></section>
    <section class="tab panel" data-tab="friends" id="tabFriends" hidden></section>
    <section class="tab panel" data-tab="top" id="tabTop" hidden></section>
  </main>

  <nav class="nav" aria-label="Разделы">
    <button type="button" data-go="game" aria-current="page"><svg><use href="#i-sword"/></svg>Бой</button>
    <button type="button" data-go="upgrades"><svg><use href="#i-up"/></svg>Улучшения</button>
    <button type="button" data-go="tasks"><svg><use href="#i-list"/></svg>Задания<i class="dot" id="navDot" hidden></i></button>
    <button type="button" data-go="friends"><svg><use href="#i-people"/></svg>Друзья</button>
    <button type="button" data-go="top"><svg><use href="#i-trophy"/></svg>Рейтинг</button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function(){
  // Placeholders: replace with the client's bot and channel
  var BOT = 'your_bot';
  var CHANNEL_URL = 'https://t.me/your_channel';
  var SITE_URL = 'https://example.com';

  var tg = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform && window.Telegram.WebApp.platform !== 'unknown') ? window.Telegram.WebApp : null;
  var KEY = 'rune-guardian-demo-v1';
  var OFFLINE_CAP = 3 * 3600;
  var BOSSES = [
    {n:'Каменный страж',   c:['#c8b6ff','#6c51d8','#2a1c6b']},
    {n:'Ледяной голем',    c:['#d2f5ff','#4aa9d6','#123e63']},
    {n:'Пепельный колосс', c:['#ffd0a8','#d0623a','#5a1b12']},
    {n:'Хранитель рун',    c:['#c6ffe0','#3fae84','#0f4637']},
    {n:'Тень пустоши',     c:['#ddd5ea','#6b5f86','#221c33']},
    {n:'Древний обелиск',  c:['#fff0bf','#c99a35','#4f3610']}
  ];
  var ROMAN = ['','II','III','IV','V','VI','VII','VIII','IX','X'];
  var BASE = {power:40, cap:60, regen:90, merc:120};
  var DAILY = [100,250,500,1000,2000,4000,8000];
  var FRIEND_BONUS = 2500;
  var FRIEND_NAMES = ['Алексей','Mira','Денис','Kotik_77','Ульяна','Rendal','Святослав','Ника'];
  var LEADERS = [['Arkhon',184200],['Вельмира',151900],['Kael_88',122400],['Тормунд',98700],['Lirien',73100],['Гримбальд',52800],['Nyx',31400],['Беор',18900],['Sable',9600],['Ольгерд',4200]];

  var UPG = [
    {k:'power', t:'Сила удара',     d:'Больше урона и золота за каждый удар', icon:'i-sword',  v:function(){return '+'+tap()}, nv:function(){return '+'+(tap()+1)}},
    {k:'cap',   t:'Запас энергии',  d:'Можно бить дольше без перерыва',        icon:'i-bolt',   v:function(){return fmt(cap())}, nv:function(){return fmt(cap()+250)}},
    {k:'regen', t:'Восстановление', d:'Энергия возвращается быстрее',          icon:'i-regen',  v:function(){return regen()+' в сек'}, nv:function(){return (regen()+1)+' в сек'}},
    {k:'merc',  t:'Наёмники',       d:'Бьют босса сами и приносят золото, даже когда игра закрыта (до 3 часов)', icon:'i-shield', v:function(){return fmt(dps()*3600)+' в час'}, nv:function(){return fmt((dps()+1)*3600)+' в час'}}
  ];
  var TASKS = [
    {id:'sub',   t:'Подписаться на канал сервера', r:1000, kind:'link', icon:'i-send', url:CHANNEL_URL},
    {id:'site',  t:'Открыть сайт проекта',          r:500,  kind:'link', icon:'i-link', url:SITE_URL},
    {id:'fr3',   t:'Пригласить 3 друзей',           r:5000, kind:'goal', icon:'i-people', prog:function(){return [S.friends.length,3]}},
    {id:'boss5', t:'Победить 5 боссов', reward:'Промокод на предмет в MMORPG', kind:'goal', icon:'i-gift', prog:function(){return [S.kills,5]}}
  ];

  function $(s){return document.querySelector(s)}
  var nf = new Intl.NumberFormat('ru-RU');
  var cf = new Intl.NumberFormat('ru-RU',{notation:'compact',maximumFractionDigits:1});
  function fmt(n){n=Math.floor(n); return n>=100000 ? cf.format(n) : nf.format(n)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  function load(){ try{ var r=localStorage.getItem(KEY); return r?JSON.parse(r):null }catch(e){ return null } }
  function save(){ S.last=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }

  var S = Object.assign({gold:0,dmg:0,boss:0,hp:null,kills:0,energy:null,lv:{},last:Date.now(),daily:{day:null,streak:0},tasks:{},friends:[],promo:null,uid:null}, load()||{});
  S.lv = Object.assign({power:0,cap:0,regen:0,merc:0}, S.lv);

  var user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  var pname = user ? (user.first_name || 'Игрок') : 'Странник';
  if(!S.uid) S.uid = user ? user.id : Math.floor(Math.random()*9e6+1e6);

  function tap(){return 1+S.lv.power}
  function cap(){return 500+250*S.lv.cap}
  function regen(){return 2+S.lv.regen}
  function dps(){return S.lv.merc}
  function bossMax(i){return Math.round(150*Math.pow(1.6,i))}
  function cost(k){return Math.round(BASE[k]*Math.pow(1.7,S.lv[k]))}
  function refLink(){return 'https://t.me/'+BOT+'?start=ref_'+S.uid}

  if(S.hp==null) S.hp = bossMax(S.boss);
  if(S.energy==null) S.energy = cap();

  var els = {
    gold:$('#gold'), stTap:$('#stTap'), stMerc:$('#stMerc'), stKills:$('#stKills'),
    bossName:$('#bossName'), bossNo:$('#bossNo'), hpFill:$('#hpFill'), hpText:$('#hpText'),
    enFill:$('#enFill'), enText:$('#enText'), enRate:$('#enRate'),
    boss:$('#boss'), arena:$('#arena'), hint:$('#tapHint'), main:$('#main'),
    up:$('#tabUp'), tasks:$('#tabTasks'), friends:$('#tabFriends'), top:$('#tabTop'),
    toast:$('#toast'), dot:$('#navDot')
  };
  $('#pname').textContent = pname;
  $('#ava').textContent = pname.charAt(0).toUpperCase();

  // Telegram Mini App setup (no-op in a regular browser)
  if(tg){
    try{
      tg.ready(); tg.expand();
      if(tg.setHeaderColor) tg.setHeaderColor('#15121d');
      if(tg.setBackgroundColor) tg.setBackgroundColor('#15121d');
      if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }catch(e){}
  }
  function haptic(kind){
    if(!tg || !tg.HapticFeedback) return;
    try{ if(kind==='tap') tg.HapticFeedback.impactOccurred('light'); else tg.HapticFeedback.notificationOccurred(kind) }catch(e){}
  }

  var toastTimer;
  function toast(msg){
    els.toast.textContent = msg; els.toast.hidden = true; void els.toast.offsetWidth; els.toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ els.toast.hidden = true }, 2800);
  }
  function copy(text, input){
    function fallback(){ if(input){ input.focus(); input.select() } toast('Не удалось скопировать: текст выделен, скопируйте вручную') }
    try{ navigator.clipboard.writeText(text).then(function(){ toast('Скопировано') }, fallback) }catch(e){ fallback() }
  }

  // ---- offline progress ----
  function applyAway(sec){
    sec = Math.min(Math.max(0,sec), OFFLINE_CAP);
    S.energy = Math.min(cap(), S.energy + regen()*sec);
    var g = Math.floor(dps()*sec); S.gold += g; return g;
  }
  var offGold = applyAway((Date.now()-S.last)/1000);

  // ---- boss ----
  var dying = false;
  function bossInfo(){ return BOSSES[S.boss % BOSSES.length] }
  function paintBoss(){
    var b = bossInfo(), cycle = Math.floor(S.boss/BOSSES.length);
    els.boss.style.setProperty('--b1', b.c[0]);
    els.boss.style.setProperty('--b2', b.c[1]);
    els.boss.style.setProperty('--b3', b.c[2]);
    els.boss.style.setProperty('--b-glow', b.c[1]+'99');
    els.bossName.textContent = b.n + (cycle ? ' ' + (ROMAN[cycle] || (cycle+1)) : '');
    els.bossNo.textContent = S.boss + 1;
  }
  function damage(n){
    if(dying) return;
    S.hp -= n;
    if(S.hp <= 0) kill();
  }
  function kill(){
    dying = true;
    var reward = Math.round(bossMax(S.boss)*0.6), name = els.bossName.textContent;
    S.gold += reward; S.kills++;
    haptic('success');
    toast('Победа! ' + name + ': +' + fmt(reward) + ' золота');
    els.boss.classList.add('dying');
    setTimeout(function(){
      S.boss++; S.hp = bossMax(S.boss); paintBoss();
      els.boss.classList.remove('dying'); els.boss.classList.add('appear');
      setTimeout(function(){ els.boss.classList.remove('appear') }, 500);
      dying = false; dirty = true; save();
    }, 550);
  }

  // ---- effects ----
  function fx(cls, x, y, text){
    if(els.arena.childElementCount > 80) return null;
    var el = document.createElement('span');
    el.className = 'fx ' + cls;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    if(text) el.textContent = text;
    el.addEventListener('animationend', function(){ el.remove() });
    setTimeout(function(){ el.remove() }, 1500);
    els.arena.appendChild(el);
    return el;
  }
  function burst(x, y){
    var col = bossInfo().c[0];
    for(var i=0;i<6;i++){
      var a = Math.random()*Math.PI*2, d = 40 + Math.random()*50;
      var s = fx('shard', x, y);
      if(!s) return;
      s.style.setProperty('--c', col);
      s.style.setProperty('--dx', Math.cos(a)*d + 'px');
      s.style.setProperty('--dy', Math.sin(a)*d + 'px');
    }
  }
  function pulse(){ els.boss.classList.remove('hit'); void els.boss.offsetWidth; els.boss.classList.add('hit') }

  // ---- tapping ----
  var lastNoEnergy = 0;
  function hit(cx, cy){
    if(dying) return;
    var t = tap();
    if(S.energy < t){
      if(Date.now()-lastNoEnergy > 2000){ toast('Энергия закончилась. Она восстанавливается сама, а улучшения ускоряют процесс'); lastNoEnergy = Date.now() }
      haptic('error'); return;
    }
    S.energy -= t; S.gold += t; S.dmg += t;
    var r = els.arena.getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
    fx('dmg', x, y, '-' + fmt(t));
    burst(x, y); pulse(); haptic('tap');
    els.hint.hidden = true;
    damage(t);
    renderHud();
  }
  els.boss.addEventListener('pointerdown', function(e){ e.preventDefault(); hit(e.clientX, e.clientY) });
  els.boss.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      var b = els.boss.getBoundingClientRect();
      hit(b.left + b.width/2 + (Math.random()-.5)*60, b.top + b.height*0.4 + (Math.random()-.5)*60);
    }
  });
  els.arena.addEventListener('contextmenu', function(e){ e.preventDefault() });

  // ---- tabs ----
  var activeTab = 'game';
  function showTab(id){
    activeTab = id;
    document.querySelectorAll('.tab').forEach(function(t){ t.hidden = t.dataset.tab !== id });
    document.querySelectorAll('.nav button').forEach(function(b){ if(b.dataset.go===id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current') });
    if(id==='upgrades') renderUpgrades();
    if(id==='tasks') renderTasks();
    if(id==='friends') renderFriends();
    if(id==='top') renderTop();
    els.main.scrollTop = 0;
  }

  function renderUpgrades(){
    els.up.innerHTML = '<header><h2>Улучшения</h2><p class="lead">Тратьте золото, чтобы бить сильнее и дольше. Наёмники работают, даже когда игра закрыта.</p></header>' +
      '<ul class="list">' + UPG.map(function(u){
        return '<li class="card"><div class="ic"><svg><use href="#'+u.icon+'"/></svg></div>' +
          '<div><h3>'+u.t+'<span class="lvl">ур. '+(S.lv[u.k]+1)+'</span></h3><p>'+u.d+'</p>' +
          '<div class="delta">'+u.v()+' → <b>'+u.nv()+'</b></div></div>' +
          '<button class="btn" type="button" data-buy="'+u.k+'"'+(S.gold<cost(u.k)?' disabled':'')+'><svg class="coin sm"><use href="#i-coin"/></svg>'+fmt(cost(u.k))+'</button></li>';
      }).join('') + '</ul>';
  }
  function buy(k){
    var c = cost(k); if(S.gold < c) return;
    S.gold -= c; S.lv[k]++;
    if(k==='cap') S.energy += 250;
    var u = UPG.filter(function(x){return x.k===k})[0];
    haptic('success'); toast(u.t + ': уровень ' + (S.lv[k]+1));
    renderUpgrades(); dirty = true; save();
  }

  function dayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate() }
  function dailyState(){
    var today = dayKey();
    if(S.daily.day === today) return {claimed:true, idx:S.daily.streak-1};
    var y = new Date(); y.setDate(y.getDate()-1);
    var next = S.daily.day === dayKey(y) ? (S.daily.streak % 7) + 1 : 1;
    return {claimed:false, idx:next-1};
  }
  function claimDaily(){
    var ds = dailyState(); if(ds.claimed) return;
    S.daily = {day:dayKey(), streak:ds.idx+1};
    S.gold += DAILY[ds.idx];
    haptic('success'); toast('Ежедневная награда: +' + fmt(DAILY[ds.idx]) + ' золота');
    renderTasks(); dirty = true; save();
  }
  function genPromo(){
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = 'RUNE-';
    for(var i=0;i<8;i++){ if(i===4) s += '-'; s += a.charAt(Math.floor(Math.random()*a.length)) }
    return s;
  }
  function renderTasks(){
    var ds = dailyState();
    var days = DAILY.map(function(r,i){
      var got = i < ds.idx || (ds.claimed && i === ds.idx);
      return '<div class="day'+(got?' got':'')+(i===ds.idx?' now':'')+'"><span>День '+(i+1)+'</span><b>'+cf.format(r)+'</b></div>';
    }).join('');
    var items = TASKS.map(function(t){
      var st = S.tasks[t.id], right, extra = '';
      if(t.kind==='link'){
        right = st==='done' ? '<span class="done">Готово</span>'
          : st==='pending' ? '<button class="btn" type="button" data-check="'+t.id+'">Проверить</button>'
          : '<button class="btn ghost" type="button" data-open="'+t.id+'">Перейти</button>';
      } else {
        var p = t.prog(), ok = p[0] >= p[1];
        extra = '<div class="prog"><i style="--w:'+Math.min(100,p[0]/p[1]*100)+'%"></i></div>';
        right = st==='done' ? '<span class="done">Получено</span>'
          : ok ? '<button class="btn" type="button" data-claim="'+t.id+'">Забрать</button>'
          : '<span class="count">'+Math.min(p[0],p[1])+' / '+p[1]+'</span>';
      }
      var reward = t.r ? '<span class="rw"><svg class="coin sm"><use href="#i-coin"/></svg>+'+fmt(t.r)+'</span>' : '<span class="rw">'+t.reward+'</span>';
      return '<li class="card"><div class="ic"><svg><use href="#'+t.icon+'"/></svg></div><div><h3>'+t.t+'</h3>'+reward+extra+'</div>'+right+'</li>';
    }).join('');
    var promo = S.promo ? '<div class="promo"><div><span class="eyebrow">Промокод для игры</span><code>'+S.promo+'</code></div><button class="btn ghost" type="button" data-copy-promo>Копировать</button></div>' : '';
    els.tasks.innerHTML = '<header><h2>Задания</h2><p class="lead">Заходите каждый день и выполняйте задания. За них дают золото и награды для основной игры.</p></header>' +
      '<section class="daily"><div class="daily-top"><div><h3>Ежедневная награда</h3><p>'+(ds.claimed?'Сегодня получено. Следующая награда завтра.':'Заходите без пропусков, и награда будет расти.')+'</p></div>' +
      '<button class="btn" type="button" id="claimDaily"'+(ds.claimed?' disabled':'')+'>'+(ds.claimed?'Завтра':'+'+fmt(DAILY[ds.idx]))+'</button></div><div class="days">'+days+'</div></section>' +
      promo + '<ul class="list">'+items+'</ul>' +
      '<p class="note">Демо: подписка засчитывается по кнопке. В рабочей версии бот проверяет её через Telegram.</p>';
    updateDot();
  }
  function claimTask(id){
    var t = TASKS.filter(function(x){return x.id===id})[0], p = t.prog();
    if(p[0] < p[1] || S.tasks[id]==='done') return;
    S.tasks[id] = 'done';
    if(t.r){ S.gold += t.r; toast('Задание выполнено: +' + fmt(t.r) + ' золота') }
    else { S.promo = genPromo(); toast('Промокод получен. Введите его в основной игре') }
    haptic('success'); renderTasks(); dirty = true; save();
  }

  function when(ts){
    var d = new Date(ts);
    return dayKey(d) === dayKey() ? 'Сегодня' : d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  }
  function renderFriends(){
    var list = S.friends.length
      ? '<ul class="list">' + S.friends.map(function(f){
          return '<li class="card friend"><div class="ava sm">'+esc(f.n.charAt(0))+'</div><div><h3>'+esc(f.n)+'</h3><p>'+when(f.t)+'</p></div><span class="rw"><svg class="coin sm"><use href="#i-coin"/></svg>+'+fmt(FRIEND_BONUS)+'</span></li>';
        }).join('') + '</ul>'
      : '<div class="empty"><h3>Пока никого</h3><p>Отправьте ссылку другу. Когда друг откроет по ней игру, вы оба получите по '+fmt(FRIEND_BONUS)+' золота.</p></div>';
    els.friends.innerHTML = '<header><h2>Друзья</h2><p class="lead">Зовите друзей в игру. За каждого вы оба получаете '+fmt(FRIEND_BONUS)+' золота, а друг сразу попадает в бота проекта.</p></header>' +
      '<div class="ref"><label for="refLink">Ваша ссылка-приглашение</label><div class="ref-row"><input id="refLink" readonly value="'+esc(refLink())+'"><button class="btn ghost" type="button" id="copyRef">Копировать</button></div>' +
      (tg ? '<button class="btn wide" type="button" id="shareRef">Отправить другу</button>' : '') + '</div>' +
      '<div class="friends-head"><span>Приглашено: <b>'+S.friends.length+'</b></span><span>Заработано: <b>'+fmt(S.friends.length*FRIEND_BONUS)+'</b></span></div>' +
      list +
      '<button class="btn ghost wide" type="button" id="addFriend">Добавить тестового друга</button>' +
      '<p class="note">Демо: кнопка выше имитирует переход друга по ссылке.</p>';
  }
  function addFriend(){
    var name = FRIEND_NAMES[S.friends.length % FRIEND_NAMES.length];
    S.friends.unshift({n:name, t:Date.now()});
    S.gold += FRIEND_BONUS;
    haptic('success'); toast('Новый друг: ' + name + '. +' + fmt(FRIEND_BONUS) + ' золота');
    renderFriends(); dirty = true; save();
  }

  function renderTop(){
    var rows = LEADERS.map(function(l){return {n:l[0], d:l[1]}}).concat([{n:pname, d:S.dmg, me:true}]).sort(function(a,b){return b.d-a.d});
    els.top.innerHTML = '<header><h2>Рейтинг</h2><p class="lead">Игроки с наибольшим уроном за сезон. Тройка лидеров получает награды в основной игре.</p></header>' +
      '<ol class="board">' + rows.map(function(r,i){
        return '<li class="row'+(r.me?' me':'')+(i<3?' p'+(i+1):'')+'"><span class="rank">'+(i+1)+'</span><span class="ava sm">'+esc(r.n.charAt(0).toUpperCase())+'</span><span class="nm">'+esc(r.n)+(r.me?'<em>вы</em>':'')+'</span><span class="val">'+fmt(r.d)+'</span></li>';
      }).join('') + '</ol>' +
      '<p class="note">Демо: соперники в списке для примера. В рабочей версии рейтинг считается на сервере по реальным игрокам.</p>';
  }

  function updateDot(){ els.dot.hidden = dailyState().claimed }

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b || b === els.boss) return;
    var d = b.dataset;
    if(d.go){ showTab(d.go); return }
    if(d.buy){ buy(d.buy); return }
    if(b.id==='claimDaily'){ claimDaily(); return }
    if(d.open){
      var t = TASKS.filter(function(x){return x.id===d.open})[0];
      if(tg){ try{ t.url.indexOf('https://t.me/')===0 ? tg.openTelegramLink(t.url) : tg.openLink(t.url) }catch(err){} }
      S.tasks[d.open] = 'pending'; renderTasks(); save(); return;
    }
    if(d.check){
      var id = d.check; b.disabled = true; b.textContent = 'Проверяем…';
      setTimeout(function(){
        var task = TASKS.filter(function(x){return x.id===id})[0];
        if(S.tasks[id] !== 'done'){ S.tasks[id] = 'done'; S.gold += task.r; toast('Задание выполнено: +' + fmt(task.r) + ' золота'); haptic('success') }
        renderTasks(); dirty = true; save();
      }, 900);
      return;
    }
    if(d.claim){ claimTask(d.claim); return }
    if('copyPromo' in d){ copy(S.promo); return }
    if(b.id==='copyRef'){ copy(refLink(), $('#refLink')); return }
    if(b.id==='shareRef' && tg){ try{ tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent('Бей боссов вместе со мной и получи бонус на старте')) }catch(err){} return }
    if(b.id==='addFriend'){ addFriend(); return }
    if(b.id==='demoChip'){ toast('Демо: прогресс хранится на этом устройстве. В рабочей версии он хранится на сервере и защищён от накрутки'); return }
  });

  // ---- main loop ----
  var dirty = true, lastT = performance.now(), mercAcc = 0, saveAcc = 0;
  function renderHud(){
    els.gold.textContent = fmt(S.gold);
    els.stTap.textContent = '+' + fmt(tap());
    els.stMerc.textContent = fmt(dps()*3600);
    els.stKills.textContent = fmt(S.kills);
    var m = bossMax(S.boss), hp = Math.max(0, S.hp);
    els.hpFill.style.setProperty('--w', (hp/m*100) + '%');
    els.hpText.textContent = fmt(Math.ceil(hp)) + ' / ' + fmt(m);
    var c = cap();
    els.enFill.style.setProperty('--w', (S.energy/c*100) + '%');
    els.enText.textContent = fmt(S.energy) + ' / ' + fmt(c);
    els.enRate.textContent = '+' + regen() + ' в сек';
    if(activeTab==='upgrades') document.querySelectorAll('[data-buy]').forEach(function(btn){ btn.disabled = S.gold < cost(btn.dataset.buy) });
  }
  function frame(now){
    var dt = Math.min((now-lastT)/1000, 1); lastT = now;
    var c = cap();
    if(S.energy < c){ S.energy = Math.min(c, S.energy + regen()*dt); dirty = true }
    if(dps() > 0){
      mercAcc += dt;
      if(mercAcc >= 1){
        mercAcc -= 1;
        var d = dps(); S.gold += d; S.dmg += d; damage(d);
        if(activeTab==='game'){ var r = els.arena.getBoundingClientRect(); fx('dmg merc', r.width/2 + (Math.random()-.5)*120, r.height*0.28, '-' + fmt(d)) }
        dirty = true;
      }
    }
    saveAcc += dt; if(saveAcc > 2){ saveAcc = 0; save() }
    if(dirty){ renderHud(); dirty = false }
    requestAnimationFrame(frame);
  }

  var hiddenAt = null;
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ hiddenAt = Date.now(); save() }
    else if(hiddenAt){
      var g = applyAway((Date.now()-hiddenAt)/1000); hiddenAt = null; lastT = performance.now();
      if(g >= 1) toast('Наёмники добыли ' + fmt(g) + ' золота, пока вас не было');
      updateDot(); dirty = true;
    }
  });
  window.addEventListener('pagehide', save);

  paintBoss();
  if(S.dmg > 0) els.hint.hidden = true;
  renderHud(); updateDot();
  setInterval(updateDot, 60000);
  requestAnimationFrame(frame);
  if(offGold >= 1) setTimeout(function(){ toast('Наёмники добыли ' + fmt(offGold) + ' золота, пока вас не было') }, 400);
})();
</script>

</body>
</html>
